services:
  pipeline:
    build: .
    image: telecom-spark-pipeline
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./reports:/app/reports
    ports:
      - "4040:4040"   # Spark UI pendant l'exécution

  tests:
    image: telecom-spark-pipeline
    command: ["pytest", "-q"]
