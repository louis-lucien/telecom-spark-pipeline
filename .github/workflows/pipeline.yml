name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests-et-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Tests unitaires
        run: pytest -q

      - name: Pipeline complet (génération -> Bronze -> Silver -> Gold -> marts)
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          mkdir -p reports
          spark-submit --driver-memory 4g src/main.py --step all 2>&1 | tee reports/execution.log

      - name: Rapport qualité dans le résumé
        if: always()
        run: cat reports/qualite_silver.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Indicateurs clés de l'exécution
        run: |
          python - <<'EOF'
          import csv, glob, json, re
          from collections import Counter

          rapport = json.load(open("reports/qualite_silver.json", encoding="utf-8"))
          for table, r in rapport.items():
              print(f"::notice title=Qualité {table}::{r['lignes_bronze']:,} lignes Bronze, "
                    f"{r['doublons_supprimes']:,} doublons, {sum(r['rejets'].values()):,} rejets {r['rejets']}, "
                    f"{r['lignes_silver']:,} lignes Silver ({r['taux_rejet']:.2%} écartées)")

          vue = glob.glob("exports/vue_360_client/*.csv")[0]
          statuts = Counter(row["statut_engagement"] for row in csv.DictReader(open(vue, encoding="utf-8")))
          print(f"::notice title=Vue 360::{sum(statuts.values()):,} abonnés : {dict(statuts)}")

          duree = re.search(r"Pipeline terminé en ([\d.]+) s", open("reports/execution.log", encoding="utf-8").read())
          print(f"::notice title=Durée::Pipeline complet en {duree.group(1)} s")
          EOF

      - name: Publication des rapports et des exports Power BI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-et-exports
          path: |
            reports/
            exports/
